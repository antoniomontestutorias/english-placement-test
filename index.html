    function validateStudentData() {
        const name = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();
        const country = document.getElementById('country').value.trim();
        const city = document.getElementById('city').value.trim();

        if (!name || !email || !phone || !country || !city) {
            alert('Por favor completa todos los campos de registro.');
            return;
        }

        studentData = { name, email, phone, country, city };
        localStorage.setItem('placement_student', JSON.stringify(studentData));

        document.getElementById('step-data').classList.add('hidden');
        document.getElementById('step-tech').classList.remove('hidden');
    }

    function playTestAudio() {
        const statusMsg = document.getElementById('audioStatusMsg');
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            osc.start();
            osc.stop(ctx.currentTime + 0.6);
            statusMsg.textContent = "✅ Audio de prueba reproducido correctamente.";
        } catch (e) {
            statusMsg.textContent = "❌ Error al reproducir audio.";
            statusMsg.style.color = "var(--error)";
        }
    }

    let isRecordingTest = false;
    function toggleTestRecording() {
        const btn = document.getElementById('recTestBtn');
        const statusMsg = document.getElementById('micStatusMsg');
        const playback = document.getElementById('testAudioPlayback');
        const transcriptBox = document.getElementById('transcript_test');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!isRecordingTest) {
            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                mediaRecorderTest = new MediaRecorder(stream);
                audioChunksTest = [];
                mediaRecorderTest.ondataavailable = e => audioChunksTest.push(e.data);
                mediaRecorderTest.onstop = () => {
                    const blob = new Blob(audioChunksTest, { type: 'audio/webm' });
                    playback.src = URL.createObjectURL(blob);
                    playback.classList.remove('hidden');
                    statusMsg.textContent = "✅ ¡Audio de prueba guardado y verificado!";
                    statusMsg.style.color = "var(--success)";
                };
                mediaRecorderTest.start();
                isRecordingTest = true;
                btn.textContent = '⏹️ Detener Prueba';
                btn.style.background = 'var(--error)';
                statusMsg.textContent = "🎤 Grabando... Habla claro al micrófono.";

                if (SpeechRecognition) {
                    testRecognition = new SpeechRecognition();
                    testRecognition.lang = 'es-ES';
                    testRecognition.continuous = true;
                    testRecognition.interimResults = true;

                    let finalRes = '';
                    testRecognition.onresult = (e) => {
                        let interim = '';
                        for (let i = e.resultIndex; i < e.results.length; ++i) {
                            if (e.results[i].isFinal) finalRes += e.results[i][0].transcript + ' ';
                            else interim += e.results[i][0].transcript;
                        }
                        transcriptBox.textContent = finalRes + interim;
                    };
                    testRecognition.onerror = (err) => {
                        console.warn("Speech recognition error:", err);
                        transcriptBox.textContent = "(Nota: El navegador no pudo capturar texto en vivo, pero el audio se graba correctamente).";
                    };
                    try {
                        testRecognition.start();
                    } catch(err) {
                        console.error(err);
                    }
                } else {
                    transcriptBox.textContent = "⚠️ Tu navegador no soporta Speech-to-Text en tiempo real, pero el audio se grabará bien.";
                }

            }).catch(() => {
                alert('Acceso al micrófono denegado. Por favor permítelo en tu navegador.');
            });
        } else {
            mediaRecorderTest.stop();
            mediaRecorderTest.stream.getTracks().forEach(track => track.stop());
            if (testRecognition) testRecognition.stop();
            isRecordingTest = false;
            btn.textContent = '🔴 Iniciar Prueba de Voz';
            btn.style.background = '';
        }
    }

    let speakingRecordings = {};
    let activeMediaRecorders = {};
    let speakingAttempts = { sp_ex1: 0, sp_ex2: 0, sp_ex3: 0 };
    let recognitionInstances = {};

    function toggleSpeakingRecording(id) {
        const btn = document.getElementById(`recBtn_${id}`);
        const status = document.getElementById(`status_${id}`);
        const transcriptBox = document.getElementById(`transcript_${id}`);
        const item = examQuestions.find(e => e.id === id);

        if (!activeMediaRecorders[id]) {
            if (speakingAttempts[id] >= item.maxAttempts) {
                alert('⚠️ Has alcanzado el límite máximo de 3 intentos permitidos para este ejercicio.');
                return;
            }

            navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                let chunks = [];
                let recorder = new MediaRecorder(stream);
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    if (blob.size > 1000) {
                        speakingRecordings[id] = blob;
                        status.textContent = '✅ Grabación guardada exitosamente.';
                        status.style.color = 'var(--success)';
                    } else {
                        status.textContent = '⚠️ Grabación muy corta o vacía. Inténtalo de nuevo.';
                        status.style.color = 'var(--error)';
                    }
                };
                recorder.start();
                activeMediaRecorders[id] = { recorder, stream };
                
                speakingAttempts[id]++;

                btn.textContent = '⏹️ Detener Grabación';
                btn.style.background = 'var(--error)';
                status.textContent = `🔴 Grabando intento ${speakingAttempts[id]} de ${item.maxAttempts}...`;

                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    const recognition = new SpeechRecognition();
                    recognition.lang = 'en-US';
                    recognition.continuous = true;
                    recognition.interimResults = true;

                    let finalTranscript = '';
                    recognition.onresult = (event) => {
                        let interim = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            if (event.results[i].isFinal) {
                                finalTranscript += event.results[i][0].transcript + ' ';
                            } else {
                                interim += event.results[i][0].transcript;
                            }
                        }
                        transcriptBox.textContent = finalTranscript + interim;
                        answers[`transcript_${id}`] = finalTranscript;
                    };
                    recognition.onerror = (err) => {
                        console.warn("Speaking Speech recognition error:", err);
                    };
                    try {
                        recognition.start();
                    } catch(err) {
                        console.error(err);
                    }
                    recognitionInstances[id] = recognition;
                } else {
                    transcriptBox.textContent = "(El navegador no soporta transcripción automática en vivo, pero tu audio se está guardando correctamente).";
                }

            }).catch(() => alert('Error de acceso al micrófono.'));
        } else {
            activeMediaRecorders[id].recorder.stop();
            activeMediaRecorders[id].stream.getTracks().forEach(t => t.stop());
            activeMediaRecorders[id] = null;

            if (recognitionInstances[id]) {
                recognitionInstances[id].stop();
            }

            const itemConfig = examQuestions.find(e => e.id === id);
            let attemptsDone = speakingAttempts[id];
            let remaining = itemConfig.maxAttempts - attemptsDone;

            if (attemptsDone < itemConfig.maxAttempts) {
                btn.textContent = `🔴 Volver a Grabar (Te quedan ${remaining} intentos)`;
            } else {
                btn.textContent = `🔒 Intentos agotados (${itemConfig.maxAttempts}/${itemConfig.maxAttempts})`;
                btn.disabled = true;
                btn.style.background = 'var(--border)';
            }
            btn.style.background = '';
        }
    }

    function renderCurrentQuestion() {
        const container = document.getElementById('exam-container');
        const item = examQuestions[currentQuestionIndex];
        
        let html = `<div class="question-card">
            <span style="font-size: 0.8rem; font-weight: bold; color: var(--brand-accent); background: var(--brand-dark); padding: 3px 8px; border-radius: 4px; text-transform: uppercase;">${item.section}</span>
            <h3 style="margin-top: 10px;">${item.title}</h3>
            ${item.content || ''}`;

        if (item.questions) {
            item.questions.forEach((qObj) => {
                html += `<div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border);">
                    <p style="font-weight: 600; margin-bottom: 10px;">${qObj.q}</p>
                    <div class="options-list">`;
                qObj.options.forEach((opt, optIdx) => {
                    const checked = answers[qObj.id] === optIdx ? 'checked' : '';
                    html += `<label class="option-label">
                        <input type="radio" name="${qObj.id}" value="${optIdx}" ${checked} onclick="saveAnswer('${qObj.id}', ${optIdx})">
                        ${opt}
                    </label>`;
                });
                html += `</div></div>`;
            });
        } else if (item.type === 'textarea') {
            const val = answers[item.id] || '';
            html += `<div style="margin-top: 15px;"><textarea rows="5" placeholder="Escribe tu respuesta aquí..." oninput="saveAnswer('${item.id}', this.value)">${val}</textarea></div>`;
        } else if (item.type === 'transcription') {
            const val = answers[item.id] || '';
            html += `<div style="margin-top: 15px;"><textarea rows="6" placeholder="Escribe aquí la transcripción del audio..." oninput="saveAnswer('${item.id}', this.value)">${val}</textarea></div>`;
        }

        html += `</div>`;
        container.innerHTML = html;

        document.getElementById('progressFill').style.width = `${((currentQuestionIndex + 1) / examQuestions.length) * 100}%`;
        document.getElementById('prevBtn').style.visibility = currentQuestionIndex === 0 ? 'hidden' : 'visible';
        document.getElementById('nextBtn').textContent = currentQuestionIndex === examQuestions.length - 1 ? 'Finalizar' : 'Siguiente →';
    }

    function saveAnswer(id, val) { 
        answers[id] = val; 
        localStorage.setItem('placement_answers', JSON.stringify(answers));
    }

    function validateCurrentQuestion() {
        const item = examQuestions[currentQuestionIndex];

        if (item.questions) {
            for (let qObj of item.questions) {
                if (answers[qObj.id] === undefined || answers[qObj.id] === null) {
                    alert('⚠️ Por favor responde todas las preguntas de esta sección antes de continuar.');
                    return false;
                }
            }
        } else if (item.type === 'textarea' || item.type === 'transcription') {
            const val = answers[item.id];
            if (!val || val.trim().length === 0) {
                alert('⚠️ Por favor escribe tu respuesta antes de continuar.');
                return false;
            }
        } else if (item.type === 'speaking') {
            if (!speakingRecordings[item.id] || speakingRecordings[item.id].size < 1000) {
                alert('⚠️ Por favor realiza y guarda una grabación de audio válida antes de continuar.');
                return false;
            }
        }
        return true;
    }

    function nextQuestion() {
        if (!validateCurrentQuestion()) {
            return;
        }

        if (currentQuestionIndex < examQuestions.length - 1) {
            currentQuestionIndex++;
            localStorage.setItem('placement_index', currentQuestionIndex);
            renderCurrentQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
            finishExam();
        }
    }

    function prevQuestion() {
        if (currentQuestionIndex > 0) {
            currentQuestionIndex--;
            localStorage.setItem('placement_index', currentQuestionIndex);
            renderCurrentQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function getCefrByScore(score) {
        if (score >= 85) return 'C1 Avanzado';
        if (score >= 70) return 'B2 Intermedio Alto';
        if (score >= 55) return 'B1 Intermedio';
        if (score >= 40) return 'A2 Básico';
        return 'A1 Principiante';
    }

    function finishExam() {
        let rc = 0, rt = 0;
        examQuestions.filter(e => e.section === 'Reading').forEach(item => {
            item.questions.forEach(q => { rt++; if (answers[q.id] === q.correct) rc++; });
        });
        const scoreReading = Math.round((rc / rt) * 100);

        let lc = 0, lt = 0;
        examQuestions.filter(e => e.section === 'Listening' && e.questions).forEach(item => {
            item.questions.forEach(q => { lt++; if (answers[q.id] === q.correct) lc++; });
        });
        const scoreAudioMC = lt > 0 ? (lc / lt) * 100 : 0;

        const audio1Item = examQuestions.find(e => e.id === 'l1_transcription');
        const userTranscription = (answers['l1_transcription'] || '').toLowerCase();
        let matchedWordsCount = 0;
        if (audio1Item && audio1Item.referenceWords) {
            audio1Item.referenceWords.forEach(word => {
                if (userTranscription.includes(word)) matchedWordsCount++;
            });
            var scoreAudio1 = Math.round((matchedWordsCount / audio1Item.referenceWords.length) * 100);
        } else {
            var scoreAudio1 = 0;
        }
        const scoreListening = Math.round((scoreAudio1 + scoreAudioMC) / 2);

        let totalWritingScore = 0;
        let writingExercisesCount = 0;

        examQuestions.filter(e => e.section === 'Writing').forEach(item => {
            writingExercisesCount++;
            const userText = (answers[item.id] || '').toLowerCase().trim();

            if (item.id === 'w_ex12') {
                let exerciseScore = 0;
                if (userText.length < 15) {
                    exerciseScore = 20;
                } else {
                    const hasFutureGrammar = item.futureStructures.some(s => userText.includes(s));
                    exerciseScore += hasFutureGrammar ? 40 : 15;

                    let matchedVerbsCount = 0;
                    item.goalVerbs.forEach(v => { if (userText.includes(v)) matchedVerbsCount++; });
                    if (matchedVerbsCount >= 2) exerciseScore += 40;
                    else if (matchedVerbsCount === 1) exerciseScore += 25;
                    else exerciseScore += 10;

                    if (userText.length > 50) exerciseScore += 20;
                }
                totalWritingScore += Math.min(100, exerciseScore);
            } else {
                if (userText.length > 10) {
                    totalWritingScore += 85;
                } else {
                    totalWritingScore += 30;
                }
            }
        });
        const scoreWriting = Math.round(totalWritingScore / writingExercisesCount);

        let sd = 0;
        ['sp_ex1', 'sp_ex2', 'sp_ex3'].forEach(id => { 
            if (speakingRecordings[id] && speakingRecordings[id].size > 1000) sd++; 
        });
        const scoreSpeaking = sd === 3 ? 85 : (sd > 0 ? 60 : 40);

        const overall = Math.round((scoreReading + scoreWriting + scoreListening + scoreSpeaking) / 4);
        let cefrFull = getCefrByScore(overall);

        document.getElementById('step-exam').classList.add('hidden');
        document.getElementById('step-report').classList.remove('hidden');

        document.getElementById('repName').textContent = studentData.name;
        document.getElementById('repLocation').textContent = `${studentData.city}, ${studentData.country}`;
        document.getElementById('reportDate').textContent = new Date().toLocaleDateString();

        document.getElementById('certScoreBig').textContent = `${overall}/100`;
        document.getElementById('certLevelText').textContent = cefrFull;

        document.getElementById('circleReading').textContent = scoreReading;
        document.getElementById('labelReading').textContent = getCefrByScore(scoreReading);

        document.getElementById('circleListening').textContent = scoreListening;
        document.getElementById('labelListening').textContent = getCefrByScore(scoreListening);

        document.getElementById('circleWriting').textContent = scoreWriting;
        document.getElementById('labelWriting').textContent = getCefrByScore(scoreWriting);

        document.getElementById('circleSpeaking').textContent = scoreSpeaking;
        document.getElementById('labelSpeaking').textContent = getCefrByScore(scoreSpeaking);

        document.getElementById('abilityDescription').textContent = `El estudiante demuestra un nivel general equivalente a ${cefrFull}, evaluando de forma integral sus competencias en comprensión y producción.`;
        document.getElementById('improvementDescription').textContent = "Se aconseja reforzar la habilidad con menor puntuación mediante práctica guiada y retroalimentación directa.";

        const isSincelejo = studentData.city.toLowerCase().includes('sincelejo');
        document.getElementById('recommendedServiceText').innerHTML = isSincelejo 
            ? "Basado en tu ubicación (Sincelejo), te recomendamos: <strong>Paquete Presencial o Mixto (2 o 3 veces/semana)</strong> para mayor inmersión y práctica conversacional."
            : `Basado en tu ubicación (${studentData.city}), te recomendamos idealmente nuestros servicios online: <strong>Paquete Virtual (3 veces/semana)</strong> o <strong>Clase Particular (Virtual)</strong>.`;

        localStorage.removeItem('placement_student');
        localStorage.removeItem('placement_answers');
        localStorage.removeItem('placement_index');

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function downloadPDF() {
        window.print();
    }
</script>
